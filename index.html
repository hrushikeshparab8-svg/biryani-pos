<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>The House of Biryani’s POS</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="print.css">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>

<div id="login">
  <h2 id="shopName">The House of Biryani’s</h2>
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<div id="app" hidden>
<header id="headerName">The House of Biryani’s POS</header>

<div class="modes">
  <button onclick="setMode('Table 1')">Table 1</button>
  <button onclick="setMode('Table 2')">Table 2</button>
  <button onclick="setMode('Table 3')">Table 3</button>
  <button onclick="setMode('Zomato')">Zomato</button>
  <button onclick="setMode('Swiggy')">Swiggy</button>
  <button onclick="setMode('Take Away')">Take Away</button>
</div>

<section class="billing">
  <input id="item" placeholder="Item name">
  <input id="price" type="number" placeholder="Price">
  <input id="qty" type="number" value="1">
  <button onclick="addItem()">Add</button>
</section>

<ul id="items"></ul>

<div class="summary">
  Subtotal: ₹<span id="sub">0</span><br>
  GST: ₹<span id="gst">0</span><br>
  Total: ₹<span id="total">0</span>
</div>

<div class="actions">
  <button onclick="saveBill()">Save</button>
  <button onclick="printBill()">Print</button>
  <button onclick="openSettings()">Settings</button>
</div>
</div>

<script src="app.js"></script>
</body>
</html>
